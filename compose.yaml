services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: restockos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - restock-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restockos"]
      interval: 3s
      timeout: 2s
      retries: 15
volumes:
  restock-db:
